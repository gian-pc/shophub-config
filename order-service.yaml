server:
  port: 8082
  error:
    include-message: always

spring:
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/shophub
    username: shophub
    password: shophub
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
      circuitbreaker:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka

# ========================================
# RESILIENCE4J - ASPECT ORDER FIX
# ========================================
resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1   # CircuitBreaker outer (ejecuta primero)
    instances:
      ProductClient:
        registerHealthIndicator: true   # Expone en /actuator/health
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    retryAspectOrder: 2   # Retry inner (ejecuta despues, dentro del CircuitBreaker)
    instances:
      ProductClient:
        max-attempts: 3
        wait-duration: 1000ms

# ========================================
# ACTUATOR - OBSERVABILIDAD (Sprint 6)
# ========================================
management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,retryevents,metrics
  endpoint:
    health:
      show-details: always   # Muestra el detalle del estado del CB
  health:
    circuitbreakers:
      enabled: true
